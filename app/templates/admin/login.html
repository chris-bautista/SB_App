<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Iniciar sesión · Panel</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/output.css') }}">
</head>
<body class="flex min-h-screen items-center justify-center bg-tinta px-5 text-hueso font-sans">
  <form method="post" action="{{ url_for('admin_login_post') }}"
        class="w-full max-w-sm rounded-xl border border-borde bg-grafito p-8">
    <p class="eyebrow mb-2">Panel de administración</p>
    <h1 class="mb-6 font-display text-2xl font-semibold tracking-tight">Iniciar sesión</h1>

    {% if error %}
    <p class="mb-4 rounded-lg border border-red-500/40 bg-red-500/10 px-4 py-2 text-sm text-red-300">{{ error }}</p>
    {% endif %}

    <label class="mb-1 block text-sm text-humo" for="usuario">Usuario</label>
    <input id="usuario" name="usuario" type="text" required autofocus
           class="mb-4 w-full rounded-lg border border-borde bg-tinta px-3 py-2 text-hueso outline-none focus:border-azul">

    <label class="mb-1 block text-sm text-humo" for="password">Contraseña</label>
    <input id="password" name="password" type="password" required
           class="mb-6 w-full rounded-lg border border-borde bg-tinta px-3 py-2 text-hueso outline-none focus:border-azul">

    <button type="submit"
            class="w-full rounded-lg bg-azul px-4 py-2.5 font-display font-medium text-white transition-colors hover:bg-azul-alto">
      Entrar
    </button>
  </form>
</body>
</html>
